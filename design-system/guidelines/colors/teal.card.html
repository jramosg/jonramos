<!-- @dsCard group="Colors" viewport="700x190" name="Teal — the signature" subtitle="A deep lagoon teal built around #31999B" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-base); color: var(--text); font-family: var(--font-mono); }
  .wrap { padding: 26px 30px; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-md); border: 1px solid var(--hairline); }
  .meta { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .tok { font-size: 11px; color: var(--text); }
  .hex { font-size: 10.5px; color: var(--text-subtle); text-transform: uppercase; }
  .lead { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 16px; display: inline-flex; gap: 8px; }
  .lead::before { content: ';;'; color: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="lead">teal · lagoon · brand</div>
    <div class="row">
      <div class="sw"><div class="chip" style="background:var(--teal-300)"></div><div class="meta"><span class="tok">teal-300</span><span class="hex">#8FD0D2</span></div></div>
      <div class="sw"><div class="chip" style="background:var(--teal-400)"></div><div class="meta"><span class="tok">teal-400 · accent</span><span class="hex">#5CB6B8</span></div></div>
      <div class="sw"><div class="chip" style="background:var(--teal-500)"></div><div class="meta"><span class="tok">teal-500 · brand</span><span class="hex">#31999B</span></div></div>
      <div class="sw"><div class="chip" style="background:var(--teal-600)"></div><div class="meta"><span class="tok">teal-600 · light</span><span class="hex">#267879</span></div></div>
      <div class="sw"><div class="chip" style="background:var(--teal-700)"></div><div class="meta"><span class="tok">teal-700</span><span class="hex">#1C5C5D</span></div></div>
      <div class="sw"><div class="chip" style="background:var(--teal-900)"></div><div class="meta"><span class="tok">teal-900</span><span class="hex">#082121</span></div></div>
    </div>
  </div>
</body>
</html>
