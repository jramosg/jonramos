<!-- @dsCard group="Type" viewport="700x230" name="Display — the human voice" subtitle="Crimson Pro, high-contrast serif, set large & tight" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-base); color: var(--text); }
  .wrap { padding: 26px 30px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-subtle); display: inline-flex; gap: 8px; margin-bottom: 14px; }
  .eyebrow::before { content: ';;'; color: var(--accent); }
  .display { font-family: var(--font-serif); font-weight: 600; font-size: 58px; line-height: 1.04; letter-spacing: -0.02em; color: var(--text-strong); }
  .display em { font-style: italic; font-weight: 500; color: var(--accent); }
  .spec { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 16px; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">crimson pro · 600 / 500 italic</div>
    <div class="display">Built with <em>care</em>,<br>shipped with intent.</div>
    <div class="spec">var(--font-serif) · clamp to --text-4xl · tracking −0.02em · leading 1.04</div>
  </div>
</body>
</html>
