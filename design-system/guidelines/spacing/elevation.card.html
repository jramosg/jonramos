<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation — hairline first" subtitle="Depth carried by borders, then quiet shadow" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-base); color: var(--text); font-family: var(--font-mono); }
  .wrap { padding: 30px; display: flex; gap: 24px; align-items: center; }
  .card { flex: 1; height: 84px; background: var(--surface-raised); border: 1px solid var(--hairline); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-subtle); letter-spacing: 0.06em; }
  .e1 { box-shadow: var(--shadow-sm); }
  .e2 { box-shadow: var(--shadow-md); }
  .e3 { box-shadow: var(--shadow-lg); }
  .e4 { box-shadow: var(--glow-teal); border-color: var(--accent-line); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card e1">shadow-sm</div>
    <div class="card e2">shadow-md</div>
    <div class="card e3">shadow-lg</div>
    <div class="card e4" style="color:var(--accent)">glow-moss</div>
  </div>
</body>
</html>
