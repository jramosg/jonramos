<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base unit — a quiet, crisp grid" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-base); color: var(--text); font-family: var(--font-mono); }
  .wrap { padding: 26px 30px; display: flex; gap: 16px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .bar { background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--radius-xs); height: 18px; }
  .v { font-size: 10.5px; color: var(--text-subtle); }
  .k { font-size: 10.5px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="bar" style="width:8px"></div><span class="k">2</span><span class="v">8px</span></div>
    <div class="col"><div class="bar" style="width:16px"></div><span class="k">4</span><span class="v">16</span></div>
    <div class="col"><div class="bar" style="width:24px"></div><span class="k">5</span><span class="v">24</span></div>
    <div class="col"><div class="bar" style="width:32px"></div><span class="k">6</span><span class="v">32</span></div>
    <div class="col"><div class="bar" style="width:48px"></div><span class="k">8</span><span class="v">48</span></div>
    <div class="col"><div class="bar" style="width:64px"></div><span class="k">9</span><span class="v">64</span></div>
    <div class="col"><div class="bar" style="width:96px"></div><span class="k">10</span><span class="v">96</span></div>
    <div class="col"><div class="bar" style="width:128px"></div><span class="k">11</span><span class="v">128</span></div>
  </div>
</body>
</html>
